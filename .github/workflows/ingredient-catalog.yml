name: Ingredient catalog

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test ingredient catalog
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: make test

  release:
    name: Build and publish ingredient catalog
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcNUMBER" >&2
            exit 1
          fi
          make validate-release-tag TAG="${GITHUB_REF_NAME}"

      - name: Download previous released catalog
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_tag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -z "${base_tag}" ]]; then
            exit 0
          fi
          mkdir -p .release-base
          gh release download "${base_tag}" --pattern ingredients_en.tar.gz --dir .release-base
          gh release download "${base_tag}" --pattern nutrition.tar.gz --dir .release-base
          tar -xzf .release-base/ingredients_en.tar.gz -C .release-base ingredients_en.csv
          tar -xzf .release-base/nutrition.tar.gz -C .release-base nutrition.csv
          if [[ "$(head -n 1 .release-base/ingredients_en.csv | tr -d '\r')" == "ingredient_id,taxonomy_key,name" ]]; then
            echo "path=.release-base/ingredients_en.csv" >> "${GITHUB_OUTPUT}"
          else
            echo "path=.release-base/nutrition.csv" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and verify release archives
        run: make release TAG="${GITHUB_REF_NAME}" PREVIOUS_CATALOG="${{ steps.previous.outputs.path }}"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/release/*.tar.gz)
          notes_file=dist/release/RELEASE_NOTES.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${notes_file}"
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            exit 0
          fi
          options=(--verify-tag --notes-file "${notes_file}" --title "${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-rc* ]]; then
            options+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" "${options[@]}"

  pages:
    name: Publish release history
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download release history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release-history
          gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
              continue
            fi
            directory=".release-history/${tag}"
            mkdir -p "${directory}"
            gh release download "${tag}" --pattern '*.tar.gz' --dir "${directory}"
            for archive in "${directory}"/*.tar.gz; do
              tar -xzf "${archive}" -C "${directory}"
            done
          done

      - name: Generate release history
        run: make pages RELEASES_DIR=.release-history

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
